server:
  port: 8080

spring:
  application:
    name: api-gateway

  # CONFIG CLIENT - để kết nối Config Server
  config:
    import: "optional:configserver:http://cloud-config-server:8888"

  cloud:
    config:
      fail-fast: true
      retry:
        initial-interval: 3000
        max-attempts: 10
        max-interval: 10000
        multiplier: 1.5

    gateway:  # 👈 Nằm dưới spring.cloud (rất quan trọng)
      discovery:
        locator:
          enabled: false  # ✅ Tắt auto discovery
          lower-case-service-id: true

      routes:
        - id: user-service-auth
          uri: lb://user-service
          predicates:
            - Path=/api/auth/**
          filters:
            - StripPrefix=0
            - PreserveHostHeader=true

        - id: user-service-users
          uri: lb://user-service
          predicates:
            - Path=/api/users/**
          filters:
            - StripPrefix=0

        - id: order-service
          uri: lb://order-service
          predicates:
            - Path=/api/orders/**
          filters:
            - StripPrefix=0

# EUREKA CLIENT - để kết nối Eureka Server
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka}

# ACTUATOR - để kiểm tra routes và health
management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always
    gateway:
      enabled: true  # ✅ Quan trọng để xem /actuator/gateway/routes

logging:
  level:
    com.netflix.eureka: DEBUG
    com.netflix.discovery: DEBUG
    org.springframework.cloud.gateway: DEBUG
    org.springframework.cloud.netflix.eureka: DEBUG
